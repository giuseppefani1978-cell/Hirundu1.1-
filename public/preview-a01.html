<style>
*{box-sizing:border-box}body{margin:0;background:#07172a;color:#f1f7ff;font-family:system-ui,-apple-system,sans-serif}button,select{font:inherit;min-height:44px;cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffd878;outline-offset:4px}main{max-width:480px;margin:auto;padding:24px 20px max(32px,env(safe-area-inset-bottom))}.tools{background:#fff8df;color:#172f48;padding:14px 20px;font-size:12px}.tools>div{max-width:680px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px}.tools select{max-width:100%;border:1px solid #c8b37a;border-radius:8px;background:white;padding:6px}header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 38px}.brand{letter-spacing:.17em;font-weight:900;font-size:23px}.language{background:#17304b;color:white;border:1px solid #4d6a85;border-radius:10px;padding:8px}.kicker{color:#b8d9ec;font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1{font-size:34px;line-height:1.12;letter-spacing:-.025em;margin:12px 0}p{line-height:1.5}.lead{color:#c3d4e4;margin-bottom:26px}.resume{position:relative;border:1px solid #62809b;border-radius:24px;padding:24px;background:linear-gradient(145deg,#173f60,#10243b);overflow:hidden}.resume:before{content:'';position:absolute;width:230px;height:230px;right:-100px;top:-130px;border:1px solid #5c879d;border-radius:50%;box-shadow:0 0 0 30px #6096a20a,0 0 0 60px #6096a20a;pointer-events:none}.resume small{color:#c7deec}.resume h2{font-size:29px;margin:10px 0 6px}.resume p{margin:0 0 22px;color:#c7deec;font-size:14px}.primary{width:100%;min-height:54px;border:0;border-radius:13px;background:#ffe098;color:#172f48;font-weight:800;padding:12px 16px}.journey{display:flex;gap:7px;margin:24px 0 9px}.step{flex:1;height:5px;background:#324b63;border-radius:3px}.step.done{background:#ffe098}.progress-label{display:flex;justify-content:space-between;color:#c7deec;font-size:12px}.links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.tile{text-align:left;padding:18px 14px;background:#fffaf0;color:#172f48;border:1px solid #d8c89f;border-radius:17px}.tile b{display:block;margin:10px 0 5px;font-size:16px}.tile small{font-size:12px;color:#486073;line-height:1.4;display:block}.symbol{font-size:24px}details{border-top:1px solid #31465c;margin-top:26px;padding:18px 0}summary{cursor:pointer;min-height:44px;color:#c7deec}.secondary{background:transparent;border:1px solid #637b90;border-radius:10px;color:#e0ecf7;padding:10px;margin:5px 6px 5px 0}.note{font-size:12px;color:#b4c8da}#feedback{border-left:3px solid #ffe098;padding-left:12px;min-height:24px;color:#ffe098;font-size:14px}progress{width:100%;height:8px;accent-color:#ffe098}dialog{max-width:min(400px,90vw);background:#fffaf0;color:#172f48;border:1px solid #d8c89f;border-radius:18px;padding:24px}dialog::backdrop{background:#07172abb}@media(max-width:350px){main{padding:18px 14px}h1{font-size:29px}.resume{padding:19px}.links{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<section class="tools" aria-label="Prototype"><div><strong>A01 · <span data-t="prototype"></span></strong><label><span data-t="scenario"></span> <select id="scenario"><option value="saved" data-t="saved"></option><option value="first" data-t="first"></option><option value="return" data-t="returning"></option><option value="complete" data-t="completeState"></option></select></label></div></section>
<main>
<header><span class="brand">HIRUNDU</span><select id="language" class="language" aria-label="Langue / Language"><option value="fr">FR</option><option value="it">IT</option><option value="en">EN</option><option value="es">ES</option></select></header>
<div class="kicker" data-t="eyebrow"></div><h1 id="headline"></h1><p class="lead" id="lead"></p>
<section class="resume" aria-labelledby="territory"><small id="level"></small><h2 id="territory"></h2><p id="mode"></p><button class="primary" id="continue"></button><div class="journey" aria-hidden="true" id="journey"></div><div class="progress-label"><span data-t="journey"></span><span id="count"></span></div></section>
<nav class="links"><button class="tile" id="passport"><span class="symbol" aria-hidden="true">▤</span><b data-t="passport"></b><small data-t="passportHint"></small></button><button class="tile" id="discoveries"><span class="symbol" aria-hidden="true">✧</span><b data-t="discoveries"></b><small data-t="discoveriesHint"></small></button></nav>
<details><summary data-t="more"></summary><div id="replay"></div><button class="secondary" id="settings" data-t="settings"></button></details>
<p class="note" data-t="local"></p><p class="note" id="source"></p><p id="feedback" role="status" aria-live="polite"></p>
</main>
<script>
'use strict';
const messages={
fr:{prototype:'Aperçu isolé',scenario:'État',saved:'Ma progression · lecture seule',first:'Première visite',returning:'Retour · niveau 3',completeState:'Les 9 niveaux terminés',eyebrow:'Le vol d’Aracne',hello:'Le Salento t’attend.',welcome:'On reprend le voyage ?',finished:'Quel voyage !',lead:'Neuf étapes, trois façons de jouer. À toi de prendre ton envol.',back:'Tes découvertes restent avec toi. La prochaine étape est juste ici.',end:'Les neuf niveaux sont terminés. Revisite tes découvertes ou rejoue pour le plaisir.',level:'Niveau',start:'Prendre mon envol',continue:'Continuer',again:'Rejouer le voyage',journey:'Niveaux terminés',passport:'Mon passeport',passportHint:'Acquis du jeu et visites réelles, bien distincts.',discoveries:'Mes découvertes',discoveriesHint:'Retrouver les territoires débloqués.',more:'Rejouer et réglages',replay:'Rejouer',settings:'Réglages',local:'La progression appartient à ce navigateur et à cette adresse. Les visites réelles restent facultatives.',readonly:'Aperçu en lecture seule : aucun acquis modifié. Les boutons simulent leur destination.',demo:'Scénario fictif : aucune sauvegarde modifiée.',unavailable:'Sauvegarde inaccessible ici : affichage de la première visite, sans effacement.',destination:'Destination prévue',classic:'Exploration classique',arkanoid:'Chasse Arkanoid',flight:'Chasse en vol',portrait:'Portrait',options:'Langue et audio ; aucun réglage enregistré dans cet aperçu.'},
it:{prototype:'Anteprima isolata',scenario:'Stato',saved:'I miei progressi · sola lettura',first:'Prima visita',returning:'Ritorno · livello 3',completeState:'Tutti i 9 livelli completati',eyebrow:'Il volo d’Aracne',hello:'Il Salento ti aspetta.',welcome:'Riprendiamo il viaggio?',finished:'Che viaggio!',lead:'Nove tappe, tre modi di giocare. È il momento di spiccare il volo.',back:'Le tue scoperte restano con te. La prossima tappa è qui.',end:'Hai completato nove livelli. Riscopri i luoghi o gioca ancora per divertirti.',level:'Livello',start:'Spicca il volo',continue:'Continua',again:'Rigioca il viaggio',journey:'Livelli completati',passport:'Il mio passaporto',passportHint:'Risultati del gioco e visite reali, ben distinti.',discoveries:'Le mie scoperte',discoveriesHint:'Ritrova i territori sbloccati.',more:'Rigioca e impostazioni',replay:'Rigioca',settings:'Impostazioni',local:'I progressi appartengono a questo browser e indirizzo. Le visite reali restano facoltative.',readonly:'Anteprima in sola lettura: nessun progresso modificato. I pulsanti simulano la destinazione.',demo:'Scenario dimostrativo: nessun salvataggio modificato.',unavailable:'Salvataggio non accessibile qui: prima visita mostrata senza cancellare nulla.',destination:'Destinazione prevista',classic:'Esplorazione classica',arkanoid:'Caccia Arkanoid',flight:'Caccia in volo',portrait:'Verticale',options:'Lingua e audio; nessuna impostazione salvata in questa anteprima.'},
en:{prototype:'Isolated preview',scenario:'State',saved:'My progress · read only',first:'First visit',returning:'Returning · level 3',completeState:'All 9 levels complete',eyebrow:'The flight of Aracne',hello:'Salento is waiting.',welcome:'Shall we carry on?',finished:'What a journey!',lead:'Nine stops, three ways to play. Time to take flight.',back:'Your discoveries stay with you. Your next stop is right here.',end:'All nine levels are complete. Revisit your discoveries or replay for fun.',level:'Level',start:'Take flight',continue:'Continue',again:'Replay the journey',journey:'Levels completed',passport:'My passport',passportHint:'Game achievements and real visits, kept separate.',discoveries:'My discoveries',discoveriesHint:'Find your unlocked territories.',more:'Replay and settings',replay:'Replay',settings:'Settings',local:'Progress belongs to this browser and address. Real-world visits remain optional.',readonly:'Read-only preview: no progress changed. Buttons simulate their destination.',demo:'Demo scenario: no save data changed.',unavailable:'Save data unavailable here: showing a first visit without deleting anything.',destination:'Planned destination',classic:'Classic exploration',arkanoid:'Arkanoid hunt',flight:'Flight hunt',portrait:'Portrait',options:'Language and audio; no settings saved in this preview.'},
es:{prototype:'Vista previa aislada',scenario:'Estado',saved:'Mi progreso · solo lectura',first:'Primera visita',returning:'Regreso · nivel 3',completeState:'Los 9 niveles terminados',eyebrow:'El vuelo de Aracne',hello:'El Salento te espera.',welcome:'¿Seguimos el viaje?',finished:'¡Qué viaje!',lead:'Nueve etapas, tres formas de jugar. Es hora de alzar el vuelo.',back:'Tus descubrimientos siguen contigo. La próxima etapa está aquí.',end:'Has terminado los nueve niveles. Revisa tus descubrimientos o vuelve a jugar por diversión.',level:'Nivel',start:'Alzar el vuelo',continue:'Continuar',again:'Repetir el viaje',journey:'Niveles terminados',passport:'Mi pasaporte',passportHint:'Logros del juego y visitas reales, separados.',discoveries:'Mis descubrimientos',discoveriesHint:'Encuentra los territorios desbloqueados.',more:'Repetir y ajustes',replay:'Repetir',settings:'Ajustes',local:'El progreso pertenece a este navegador y dirección. Las visitas reales siguen siendo opcionales.',readonly:'Vista previa de solo lectura: no cambia el progreso. Los botones simulan su destino.',demo:'Escenario ficticio: no cambia ningún dato guardado.',unavailable:'Datos no accesibles aquí: se muestra una primera visita sin borrar nada.',destination:'Destino previsto',classic:'Exploración clásica',arkanoid:'Búsqueda Arkanoid',flight:'Búsqueda en vuelo',portrait:'Vertical',options:'Idioma y audio; no se guardan ajustes en esta vista previa.'}
};
const territories=['Otranto','Gallipoli','Lecce','Giurdignano','Santa Maria di Leuca','Copertino','Nardò','Manduria','Ostuni'];
const $=id=>document.getElementById(id);
let lang='fr',state;
try{const saved=localStorage.getItem('__lang__');if(messages[saved])lang=saved;}catch{}
function readProgress(storage){
 const yes=k=>['true','1'].includes(storage.getItem(k));
 return territories.map((name,index)=>{const id=index+1;return {id,name,done:yes(`level${id}_won`),unlocked:id===1||yes(`level${id-1}_won`)||(id===2&&(yes('level2_unlocked')||yes('bonus_gallipoli_unlocked')))||(id===3&&(yes('level3_unlocked')||yes('bonus_lecce_unlocked')))};});
}
function model(){const scenario=$('scenario').value;let unavailable=false,progress;
 if(scenario==='saved'){try{progress=readProgress(localStorage);}catch{unavailable=true;}}
 if(!progress){const count=scenario==='return'?2:scenario==='complete'?9:0;progress=territories.map((name,i)=>({id:i+1,name,done:i<count,unlocked:i<=count}));}
 const completed=progress.filter(x=>x.done).length;
 return {progress,completed,target:progress.find(x=>!x.done&&x.unlocked)||progress[0],unavailable};
}
function announce(destination){$('feedback').textContent=messages[lang].destination+' : '+destination;}
function render(){const t=messages[lang];document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]);state=model();const {completed,target,progress}=state,all=completed===9;
 $('headline').textContent=all?t.finished:completed?t.welcome:t.hello;$('lead').textContent=all?t.end:completed?t.back:t.lead;
 $('level').textContent=t.level+' '+target.id+' / 9';$('territory').textContent=target.name;
 $('mode').textContent=t[[1,2,9].includes(target.id)?'classic':[3,5,7].includes(target.id)?'arkanoid':'flight']+' · '+t.portrait;
 $('continue').textContent=(all?t.again:completed||target.id>1?t.continue:t.start)+' →';$('count').textContent=completed+' / 9';
 $('journey').replaceChildren(...progress.map(x=>{const s=document.createElement('span');s.className='step'+(x.done?' done':'');return s;}));
 $('replay').replaceChildren(...progress.filter(x=>x.done).map(x=>{const b=document.createElement('button');b.className='secondary';b.textContent=t.replay+' · '+t.level+' '+x.id;b.onclick=()=>announce(t.level+' '+x.id);return b;}));
 $('source').textContent=state.unavailable?t.unavailable:$('scenario').value==='saved'?t.readonly:t.demo;$('feedback').textContent='';
}
$('language').onchange=e=>{lang=e.target.value;render();};$('scenario').onchange=render;
$('continue').onclick=()=>announce(messages[lang].level+' '+state.target.id);
$('passport').onclick=()=>announce(messages[lang].passport);$('discoveries').onclick=()=>announce(messages[lang].discoveries);$('settings').onclick=()=>{$('feedback').textContent=messages[lang].options;};
render();
</script>
</html>
