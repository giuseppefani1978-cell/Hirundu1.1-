<div id="hirundu-parcours" class="viz-dotted-background">
  <div class="hp-phone" lang="fr">
    <div class="hp-preview"><label><span data-copy="scenario">Aperçu</span><select id="hp-scenario" class="cursor-interaction"><option value="0">Première visite</option><option value="7" selected>Niveau 8</option><option value="9">Voyage terminé</option></select></label><label><span data-copy="language">Langue</span><select id="hp-language" class="cursor-interaction"><option value="fr">FR</option><option value="it">IT</option><option value="en">EN</option><option value="es">ES</option></select></label></div>
    <header class="hp-header"><p class="hp-brand">HIRUNDU <span>·</span> LE VOL D’ARACNE</p><div class="hp-heading"><h2 data-copy="title">Ton voyage<br>dans le Salento</h2><div class="hp-seal" aria-hidden="true">✦</div></div><p class="hp-subtitle" data-copy="subtitle">Neuf chasses. Une aventure.</p><div class="hp-summary"><span id="hp-progress">7 / 9 étapes terminées</span><span id="hp-reward">7 cartes gagnées</span></div><div class="hp-progress-track" role="progressbar" aria-label="Étapes terminées" aria-valuemin="0" aria-valuemax="9" aria-valuenow="7"><div></div></div></header>
    <ol class="hp-journey" aria-label="Parcours des neuf niveaux"></ol>
    <section class="hp-detail" aria-live="polite" aria-atomic="true"><div class="hp-detail-top"><span id="hp-state"></span><span id="hp-mode"></span></div><h3 id="hp-name"></h3><p id="hp-description"></p><button id="hp-play" class="cursor-interaction" type="button"></button><p id="hp-response" role="status"></p></section>
    <p class="hp-note" data-copy="note">Démonstration · aucune progression modifiée</p>
  </div>
</div>
<style>
#hirundu-parcours .hp-phone{box-sizing:border-box;max-width:410px;margin:auto;padding:18px 20px 16px;border-radius:28px;background:radial-gradient(ellipse at 10% 15%,#25609075,transparent 55%),radial-gradient(ellipse at 100% 50%,#81773725,transparent 50%),linear-gradient(170deg,#0b1d33,#07121e 65%,#081c24);color:#f0f6ff;font:400 14px/1.45 Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark}
#hirundu-parcours .hp-phone *{box-sizing:border-box}
#hirundu-parcours .hp-preview{display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:1px solid #ffffff1c;padding-bottom:14px;margin-bottom:23px}
#hirundu-parcours .hp-preview label{display:grid;gap:5px;font-size:11px;color:#b9cee1}
#hirundu-parcours select{border:1px solid #758ca7;border-radius:10px;background:#0c2339;color:#e9f5ff;font:500 16px system-ui;min-height:44px;max-width:100%;padding:6px 9px}
#hirundu-parcours .hp-preview label:first-child{min-width:0;flex:1}
#hirundu-parcours .hp-brand{font-size:10px;font-weight:700;letter-spacing:.13em;color:#addbff;margin:0 0 16px}
#hirundu-parcours .hp-brand span{padding:0 4px;color:#e6c779}
#hirundu-parcours .hp-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
#hirundu-parcours h2{font:800 29px/1.12 Barlow,system-ui;margin:0;color:#f0f6ff;letter-spacing:-.035em;max-width:240px}
#hirundu-parcours .hp-seal{display:grid;place-items:center;flex-shrink:0;width:52px;height:52px;border-radius:50%;font-size:32px;color:#f9dc8d;border:1px solid #e0be6560;box-shadow:inset 0 0 16px #e0be6512,0 0 25px #c9ac4620;transform:rotate(-12deg)}
#hirundu-parcours .hp-subtitle{color:#bad0e5;font-size:13px;margin:10px 0 21px}
#hirundu-parcours .hp-summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:7px;font-size:11px;color:#c4d7e8}
#hirundu-parcours #hp-reward{color:#eed497}
#hirundu-parcours .hp-progress-track{height:4px;border-radius:4px;margin-top:10px;background:#adcde920;overflow:hidden}
#hirundu-parcours .hp-progress-track>div{height:100%;background:#e0c57f;width:77.777%;transition:width .25s}
#hirundu-parcours .hp-journey{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 0;padding:25px 0 27px;margin:0;counter-reset:none}
#hirundu-parcours .hp-step{position:relative;text-align:center;min-width:0}
#hirundu-parcours .hp-step:nth-child(4){grid-column:3;grid-row:2}#hirundu-parcours .hp-step:nth-child(5){grid-column:2;grid-row:2}#hirundu-parcours .hp-step:nth-child(6){grid-column:1;grid-row:2}
#hirundu-parcours .hp-step:not(:nth-child(3n))::after{content:'';position:absolute;left:calc(50% + 28px);top:30px;width:calc(100% - 56px);height:2px;background:#92c7e142;pointer-events:none}
#hirundu-parcours .hp-step:nth-child(4)::after,#hirundu-parcours .hp-step:nth-child(5)::after{left:auto;right:calc(50% + 28px)}
#hirundu-parcours .hp-step:nth-child(3)::after,#hirundu-parcours .hp-step:nth-child(6)::after{content:'';position:absolute;left:50%;top:82px;height:22px;width:2px;background:#92c7e142;pointer-events:none}
#hirundu-parcours .hp-step button{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:82px;width:100%;padding:0 4px;background:none;color:#d8e7f3;border:0;border-radius:12px;font:500 11px/1.25 system-ui;transition:transform .16s}
#hirundu-parcours .hp-step button:active{transform:translateY(2px)}
#hirundu-parcours .hp-medallion{position:relative;display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:linear-gradient(150deg,#203951,#102435);border:1px solid #69869b;color:#c6d6e0;font:800 24px/1 system-ui;box-shadow:0 5px 0 #030d18,0 8px 16px #0003}
#hirundu-parcours .hp-done .hp-medallion{background:linear-gradient(140deg,#fff0bc,#dab55e);color:#3c3018;border-color:#fff3c6;box-shadow:0 5px 0 #8a642c,0 8px 16px #0003}
#hirundu-parcours .hp-current .hp-medallion{background:linear-gradient(140deg,#4097d3,#21598a);color:#fff;border:2px solid #d2eeff;box-shadow:0 5px 0 #123755,0 0 25px #75bfff38}
#hirundu-parcours .hp-step button[aria-pressed=true] .hp-medallion{outline:2px solid #c9eaff;outline-offset:5px}
#hirundu-parcours .hp-state-mark{position:absolute;bottom:-5px;right:-5px;display:grid;place-items:center;min-width:21px;height:21px;border-radius:8px;font:800 12px/1 system-ui;background:#102436;color:#f0dfac;border:1px solid #bda264}
#hirundu-parcours .hp-current .hp-state-mark{background:#eef8ff;color:#174061;border-color:#eef8ff}
#hirundu-parcours .hp-future .hp-state-mark{background:#102436;color:#c6d6e0;border-color:#69869b}
#hirundu-parcours .hp-detail{padding:18px;border-radius:20px;background:#0c2237;border:1px solid #7298b54a;box-shadow:0 16px 35px #020b1633}
#hirundu-parcours .hp-detail-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#b4dcff;font-size:11px;letter-spacing:.02em}
#hirundu-parcours h3{font:750 22px/1.18 Barlow,system-ui;color:#f0f6ff;margin:12px 0 8px}
#hirundu-parcours #hp-description{font-size:13px;line-height:1.5;color:#c2d6e9;margin:0 0 16px}
#hirundu-parcours #hp-play{width:100%;min-height:48px;border-radius:999px;background:linear-gradient(130deg,#2b628e,#1b416b);border:1px solid #729abd;color:#f4faff;font:700 15px/1.3 system-ui;padding:12px 16px}
#hirundu-parcours #hp-play:disabled{background:#182d40;border-color:#506579;color:#b7c9d8}
#hirundu-parcours #hp-response{font-size:12px;color:#e9d291;margin:0}#hirundu-parcours #hp-response:not(:empty){margin-top:12px}
#hirundu-parcours .hp-note{text-align:center;color:#a9c0d3;font-size:10px;margin:17px 0 0}
#hirundu-parcours button:focus-visible,#hirundu-parcours select:focus-visible{outline:3px solid #f1d891;outline-offset:4px}
@media(max-width:360px){#hirundu-parcours .hp-phone{padding:15px 14px}#hirundu-parcours h2{font-size:26px}#hirundu-parcours .hp-seal{width:42px;height:42px}#hirundu-parcours .hp-detail{padding:15px}}
@media(prefers-reduced-motion:reduce){#hirundu-parcours .hp-progress-track>div,#hirundu-parcours button{transition:none!important}#hirundu-parcours .hp-step button:active{transform:none}}
</style>
<script>
(()=>{
 const root=document.getElementById('hirundu-parcours');
 const words={
 fr:{scenario:'Aperçu',language:'Langue',scenarios:['Première visite','Niveau 8','Voyage terminé'],brand:'LE VOL D’ARACNE',title:'Ton voyage dans le Salento',subtitle:'Neuf chasses. Une aventure.',completed:'étapes terminées',cards:'cartes gagnées',done:'Terminée',current:'À toi de jouer',future:'À venir',level:'Niveau',secret:'Territoire secret',modes:['Exploration','Arkanoid','Vol'],reward:'Carte gagnée dans le jeu. La visite réelle reste facultative.',mission:'10 découvertes, puis une bataille pour gagner la carte.',locked:'Remporte l’étape précédente pour découvrir la suite.',play:'Continuer la chasse',start:'Lancer la chasse',replay:'Rejouer ce niveau',unavailable:'Étape verrouillée',note:'Démonstration · aucune progression modifiée',response:'Aperçu : lancement du niveau',all:'Les neuf étapes sont terminées. Rejoue ton étape préférée.',journey:'Parcours des neuf niveaux'},
 it:{scenario:'Anteprima',language:'Lingua',scenarios:['Prima visita','Livello 8','Viaggio completato'],brand:'IL VOLO DI ARACNE',title:'Il tuo viaggio nel Salento',subtitle:'Nove cacce. Un’avventura.',completed:'tappe completate',cards:'mappe vinte',done:'Completata',current:'Tocca a te',future:'Prossimamente',level:'Livello',secret:'Territorio segreto',modes:['Esplorazione','Arkanoid','Volo'],reward:'Mappa vinta nel gioco. La visita reale resta facoltativa.',mission:'10 scoperte, poi una battaglia per vincere la mappa.',locked:'Vinci la tappa precedente per scoprire il seguito.',play:'Continua la caccia',start:'Inizia la caccia',replay:'Rigioca il livello',unavailable:'Tappa bloccata',note:'Dimostrazione · nessun progresso modificato',response:'Anteprima: avvio del livello',all:'Le nove tappe sono complete. Rigioca la tua preferita.',journey:'Percorso dei nove livelli'},
 en:{scenario:'Preview',language:'Language',scenarios:['First visit','Level 8','Journey complete'],brand:'ARACNE’S FLIGHT',title:'Your journey through Salento',subtitle:'Nine hunts. One adventure.',completed:'stages complete',cards:'maps earned',done:'Complete',current:'Your next hunt',future:'Coming next',level:'Level',secret:'Secret territory',modes:['Exploration','Arkanoid','Flight'],reward:'Map earned in the game. A real visit remains optional.',mission:'10 discoveries, then a battle to earn the map.',locked:'Win the previous stage to discover what comes next.',play:'Continue the hunt',start:'Start the hunt',replay:'Replay this level',unavailable:'Stage locked',note:'Demo · no progress changed',response:'Preview: starting level',all:'All nine stages complete. Replay your favourite.',journey:'Journey through nine levels'},
 es:{scenario:'Vista previa',language:'Idioma',scenarios:['Primera visita','Nivel 8','Viaje completado'],brand:'EL VUELO DE ARACNE',title:'Tu viaje por el Salento',subtitle:'Nueve búsquedas. Una aventura.',completed:'etapas completadas',cards:'mapas ganados',done:'Completada',current:'Te toca jugar',future:'Próximamente',level:'Nivel',secret:'Territorio secreto',modes:['Exploración','Arkanoid','Vuelo'],reward:'Mapa ganado en el juego. La visita real sigue siendo opcional.',mission:'10 descubrimientos y una batalla para ganar el mapa.',locked:'Gana la etapa anterior para descubrir lo que sigue.',play:'Continuar la búsqueda',start:'Iniciar la búsqueda',replay:'Repetir este nivel',unavailable:'Etapa bloqueada',note:'Demostración · ningún progreso modificado',response:'Vista previa: inicio del nivel',all:'Las nueve etapas están completas. Repite tu favorita.',journey:'Recorrido de nueve niveles'}
 };
 // Level order and families follow bonusStorage.getProgressList and the approved game.
 const levels=[{id:1,name:'Otranto',family:0},{id:2,name:'Gallipoli',family:0},{id:3,name:'Lecce',family:1},{id:4,name:'Adriatico',family:2},{id:5,name:'Capo di Leuca',family:1},{id:6,name:'Arneo',family:2},{id:7,name:'Nardò',family:1},{id:8,name:'Messapia',family:2},{id:9,name:'Ostuni',family:0}];
 const modeSymbols=['⌖','▦','➤'];let lang='fr',won=7,selected=8;
 const q=s=>root.querySelector(s);const state=id=>id<=won?'done':id===won+1?'current':'future';
 function detail(){const t=words[lang],level=levels[selected-1],s=state(selected);q('#hp-state').textContent=`${t.level} ${selected} · ${t[s]}`;q('#hp-mode').textContent=modeSymbols[level.family]+' '+t.modes[level.family];q('#hp-name').textContent=s==='future'?t.secret:level.name;q('#hp-description').textContent=s==='done'?t.reward:s==='current'?t.mission:t.locked;const b=q('#hp-play');b.disabled=s==='future';b.textContent=s==='done'?t.replay:s==='current'?(won===0?t.start:t.play):t.unavailable;q('#hp-response').textContent='';root.querySelectorAll('.hp-step button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.id)===selected)));}
 function render(){const t=words[lang];q('.hp-phone').lang=lang;root.querySelectorAll('[data-copy]').forEach(n=>n.textContent=t[n.dataset.copy]);q('.hp-brand').textContent='HIRUNDU · '+t.brand;[...q('#hp-scenario').options].forEach((o,i)=>o.textContent=t.scenarios[i]);q('#hp-progress').textContent=`${won} / 9 ${t.completed}`;q('#hp-reward').textContent=`${won} ${t.cards}`;q('.hp-subtitle').textContent=won===9?t.all:t.subtitle;const bar=q('[role=progressbar]');bar.setAttribute('aria-valuenow',String(won));bar.setAttribute('aria-label',t.completed);bar.firstElementChild.style.width=(won/9*100)+'%';const list=q('.hp-journey');list.setAttribute('aria-label',t.journey);list.replaceChildren();
 levels.forEach(level=>{const s=state(level.id),li=document.createElement('li'),button=document.createElement('button'),medal=document.createElement('span'),mark=document.createElement('span'),label=document.createElement('span');li.className='hp-step hp-'+s;button.type='button';button.className='cursor-interaction';button.dataset.id=level.id;button.setAttribute('aria-label',`${t.level} ${level.id}, ${t[s]}, ${s==='future'?t.secret:level.name}, ${t.modes[level.family]}`);if(s==='current')button.setAttribute('aria-current','step');medal.className='hp-medallion';medal.textContent=String(level.id);medal.setAttribute('aria-hidden','true');mark.className='hp-state-mark';mark.textContent=s==='done'?'✓':s==='current'?'▶':'?';medal.append(mark);label.textContent=modeSymbols[level.family]+' '+t.modes[level.family];button.append(medal,label);button.addEventListener('click',()=>{selected=level.id;detail();});li.append(button);list.append(li);});detail();}
 q('#hp-scenario').addEventListener('change',e=>{won=Number(e.target.value);selected=Math.min(won+1,9);render();});q('#hp-language').addEventListener('change',e=>{lang=e.target.value;render();});q('#hp-play').addEventListener('click',()=>{if(state(selected)!=='future')q('#hp-response').textContent=words[lang].response+' '+selected+' · '+words[lang].note;});render();
})();
</script>
