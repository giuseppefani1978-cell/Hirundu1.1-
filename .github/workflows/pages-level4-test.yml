name: Level 4 flight validation — no Pages deploy

on:
  push:
    branches: [ test/niveau4-vol-adriatique-2026-09-18 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/level4-flight/game.js
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
