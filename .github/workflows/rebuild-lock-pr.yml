name: Rebuild lockfile (PR)

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: version-1.0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Show current package versions
        run: |
          echo "package.json vite ->" $(node -p "require('./package.json').devDependencies.vite")
          echo "package.json plugin-react ->" $(node -p "require('./package.json').devDependencies['@vitejs/plugin-react']")

      - name: Create relock branch
        run: |
          git switch -c bot/relock-${{ github.run_id }}

      - name: Remove old lock
        run: rm -f package-lock.json

      - name: Install (generate fresh lock)
        run: npm install

      - name: Verify generated lock content
        run: |
          test -f package-lock.json || (echo "No package-lock generated!" && exit 1)
          grep -n '"vite": {' -n package-lock.json || true
          grep -n '"@vitejs/plugin-react"' -n package-lock.json || true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit lockfile
        run: |
          git add -A
          git commit -m "chore(lock): regenerate for Vite 5 + plugin-react" || echo "No changes to commit"
          git push -u origin bot/relock-${{ github.run_id }}

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore(lock): regenerate package-lock for Vite 5 + plugin-react"
          body: "Auto-generated by workflow. Contains updated package-lock.json."
          base: version-1.0
          branch: bot/relock-${{ github.run_id }}
          labels: deps, automation
