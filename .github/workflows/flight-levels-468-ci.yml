name: Flight Levels 4-6-8 CI

on:
  push:
    branches: [ "test/niveaux4-6-8-vol-2026-09-18" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Check flight hunt syntax
        run: |
          node --check public/level4-flight/game.js
          node --check public/level6-flight/game.js
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
