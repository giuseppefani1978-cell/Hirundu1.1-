name: V9.6 Final Polish CI

on:
  push:
    branches: [ "ux/v9.6-final-polish-2026-09-16" ]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
