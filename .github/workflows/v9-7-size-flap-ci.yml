name: V9.7 Size & Flap CI

on:
  push:
    branches: [ "ux/v9.7-size-flap-polish" ]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
