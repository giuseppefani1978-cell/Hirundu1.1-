name: Generate startup animation fallback

on:
  push:
    branches:
      - fix/startup-visual-autoplay-fallback-2026-09-27
    paths-ignore:
      - public/assets/hirundu_intro.webp

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/startup-visual-autoplay-fallback-2026-09-27
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Generate animated WebP fallback
        run: >
          ffmpeg -y -i public/assets/hirundu_intro.mp4
          -an -vf "fps=15,scale='min(720,iw)':-2:flags=lanczos"
          -loop 1 -quality 82 -compression_level 5
          public/assets/hirundu_intro.webp
      - name: Commit generated fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hirundu_intro.webp
          git diff --cached --quiet && exit 0
          git commit -m "Generate startup animated WebP fallback"
          git push origin HEAD:fix/startup-visual-autoplay-fallback-2026-09-27
