name: HIRUNDU • Production Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hirundu-pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout isolated intro preview
        uses: actions/checkout@v4
        with:
          ref: work/level-intro-redesign-2026-09-30
          path: preview
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json

      - name: Validate production
        working-directory: production
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Validate and build isolated preview
        working-directory: preview
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build -- --base=/Hirundu1.1-/preview/level-intro-redesign/

      - name: Assemble production plus isolated preview
        run: |
          mkdir -p site
          cp -R production/dist/. site/
          mkdir -p site/preview/level-intro-redesign
          cp -R preview/dist/. site/preview/level-intro-redesign/
          cp site/index.html site/404.html
          touch site/.nojekyll
          printf '{\n  "sha": "%s",\n  "workflow_run": "%s",\n  "built_at": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > site/build-info.json
          printf '{\n  "branch": "%s",\n  "sha": "%s",\n  "built_at": "%s"\n}\n' \
            "work/level-intro-redesign-2026-09-30" \
            "$(git -C preview rev-parse HEAD)" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > site/preview/level-intro-redesign/preview-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy main plus isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
