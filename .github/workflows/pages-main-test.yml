name: Pages • Main + Level 4 test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          path: stable

      - name: Checkout level 4 flight candidate
        uses: actions/checkout@v4
        with:
          ref: test/niveau4-vol-adriatique-2026-09-18
          path: candidate

      - name: Checkout flight levels 4-6-8 candidate
        uses: actions/checkout@v4
        with:
          ref: test/niveaux4-6-8-vol-2026-09-18
          path: candidate468

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            stable/package-lock.json
            candidate/package-lock.json
            candidate468/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate and build main
        working-directory: stable
        run: |
          npm ci || npm install
          npm test -- --runInBand || npm test
          npm run build
          cp dist/index.html dist/404.html

      - name: Validate and build level 4 candidate
        working-directory: candidate
        run: |
          npm ci || npm install
          node --check public/level4-flight/game.js
          npm test
          npm run typecheck
          npm run build -- --base=/Hirundu1.1-/test-niveau4/

      - name: Add direct level 4 test under /test-niveau4/
        run: |
          mkdir -p stable/dist/test-niveau4
          cp -R candidate/dist/. stable/dist/test-niveau4/
          cp candidate/dist/index.html stable/dist/test-niveau4/404.html

      - name: Validate and build flight levels candidate
        working-directory: candidate468
        run: |
          npm ci || npm install
          node --check public/level4-flight/game.js
          node --check public/level6-flight/game.js
          npm test
          npm run typecheck
          npm run build -- --base=/Hirundu1.1-/test-vol-468/

      - name: Add integrated flight levels test under /test-vol-468/
        run: |
          mkdir -p stable/dist/test-vol-468
          cp -R candidate468/dist/. stable/dist/test-vol-468/
          cp candidate468/dist/index.html stable/dist/test-vol-468/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: stable/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Level 4 candidate refresh: controls/cards/hazards v2
# Level 4 candidate refresh: spacing-speed-cards v3
# Level 4 candidate refresh: speed-card-proportions v4
# Flight levels refresh: level6 arneo v1
# Flight levels refresh: level6 generated coast v2
