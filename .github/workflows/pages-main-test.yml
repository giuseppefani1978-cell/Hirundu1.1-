name: HIRUNDU • Production Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hirundu-pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Preserve GitHub Pages routing
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Write build identity
        run: |
          printf '{\n  "sha": "%s",\n  "workflow_run": "%s",\n  "built_at": "%s"\n}\n' \
            "$GITHUB_SHA" \
            "$GITHUB_RUN_ID" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > dist/build-info.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
