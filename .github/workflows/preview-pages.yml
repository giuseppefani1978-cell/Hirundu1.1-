name: Legacy PR validation — no Pages deploy

on:
  pull_request:
    branches: [ version-1.0 ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
