<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HIRUNDU – QR & Map</title>
    <!-- (Optionnel) manifest, favicons, etc. -->
  </head>
  <body>
    <div id="root"></div>

    <!-- Your app entry (React/Leaflet) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Smart back-to-game handling ( Level 2 routing ) -->
    <script type="module">
      (() => {
        // Read Level 2 status once
        const L2 = (() => {
          try { return localStorage.getItem('level2_unlocked') === 'true'; }
          catch { return false; }
        })();

        function showBanner() {
          if (!L2) return;
          if (document.getElementById('level2-banner')) return;
          const banner = document.createElement('div');
          banner.id = 'level2-banner';
          banner.textContent = '✅ Niveau 2 débloqué ! Vous pouvez reprendre le jeu.';
          banner.style.cssText =
            'position:fixed;left:12px;bottom:12px;z-index:9999;'+
            'background:#008b2f;color:#fff;font:700 13px system-ui;'+
            'padding:8px 12px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.25);';
          document.body.appendChild(banner);
        }

        function findBackBtn() {
          // Add here your exact selector if you have one (id/class)
          return document.querySelector(
            '#back-to-game, #back-to-map, .leaflet-control a, ' +
            'a[href="/index.html"], a[href="./"], a[href="#"], button.back-to-game'
          );
        }

        function setupBackBtn(btn) {
          if (!btn) return;

          // Ensure click is allowed
          btn.style.pointerEvents = 'auto';
          btn.style.cursor = 'pointer';

          if (L2) {
            // Label + link
            btn.textContent = 'Retour carte Salento (niv. 2)';
            if (btn.tagName === 'A') btn.setAttribute('href', '/index.html?level=2');

            // Force navigation even if other handlers prevent default
            const go = (e) => {
              try { e && e.preventDefault(); } catch {}
              try {
                document.body.style.transition = 'opacity 220ms ease';
                document.body.style.opacity = '0';
              } catch {}
              window.location.assign('/index.html?level=2');
            };
            btn.addEventListener('click', go, { once: true });
            btn.addEventListener('touchend', go, { passive: false, once: true });

            showBanner();
          } else {
            if (btn.tagName === 'A') btn.setAttribute('href', '/index.html');
          }
        }

        // Try immediately (if the control already exists)…
        let btn = findBackBtn();
        if (btn) {
          setupBackBtn(btn);
        } else {
          // …otherwise, wait for Leaflet/React to render it
          const mo = new MutationObserver(() => {
            const b = findBackBtn();
            if (b) {
              mo.disconnect();
              setupBackBtn(b);
            }
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });

          // Fallback CTA if still nothing after 1s
          setTimeout(() => {
            if (!L2) return;
            if (findBackBtn()) return; // appears later, no need for CTA
            if (document.getElementById('__cta_l2__')) return;

            const cta = document.createElement('a');
            cta.id = '__cta_l2__';
            cta.textContent = '↩︎ Reprendre le jeu (niv. 2)';
            cta.href = '/index.html?level=2';
            cta.style.cssText =
              'position:fixed;left:12px;bottom:12px;z-index:10010;'+
              'background:#10223c;color:#fff;font:700 14px system-ui;'+
              'padding:10px 14px;border-radius:12px;text-decoration:none;'+
              'box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;';
            cta.addEventListener('click', (e) => {
              e.preventDefault();
              window.location.assign('/index.html?level=2');
            });
            document.body.appendChild(cta);
            showBanner();
          }, 1000);
        }
      })();
    </script>
  </body>
</html>
