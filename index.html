<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>HIRUNDU – QR & Map</title>

    <!-- Couleurs & PWA -->
    <meta name="theme-color" content="#a9d6f5" />
    <link rel="manifest" href="/Hirundu1.1-/manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le Vol d’Aracne" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script type="module">
      (() => {
        const basePath = (() => {
          try {
            const path = new URL('.', document.baseURI).pathname;
            return path.endsWith('/') ? path : `${path}/`;
          } catch {
            return '/';
          }
        })();

        const withBase = (path = '') => {
          const normalized = String(path ?? '');
          if (!normalized) {
            return basePath;
          }
          const trimmed = normalized.startsWith('/') ? normalized.slice(1) : normalized;
          return `${basePath}${trimmed}`;
        };

        // util: lecture LS
        const LS = (k, d = null) => {
          try {
            return localStorage.getItem(k) ?? d;
          } catch {
            return d;
          }
        };

        // détermine la prochaine chasse jouable (niv. 3 prioritaire)
        const nextLevelHref = () => {
          const L3 = LS('level3_unlocked') === 'true';
          const L2 = LS('level2_unlocked') === 'true';
          if (L3) return withBase('index-legacy.html?level=3');
          if (L2) return withBase('index-legacy.html?level=2');
          return withBase('index-legacy.html');
        };

        // --- TOAST éphémère (consomme __toast_next__)
        const toastKey = '__toast_next__';
        const toastVal = LS(toastKey);
        if (toastVal) {
          const map = {
            otranto: 'Niveau 1 terminé ! Bonus Otranto débloqué 🎉',
            gallipoli: 'Niveau 2 terminé ! Bonus Gallipoli débloqué 🎉',
            lecce: 'Niveau 3 terminé ! Bonus Lecce débloqué 🎉',
          };
          const msg = map[toastVal] || 'Bonus débloqué 🎉';

          const t = document.createElement('div');
          t.textContent = msg;
          t.style.cssText =
            'position:fixed;left:12px;bottom:12px;z-index:9999;' +
            'background:#0e7a2b;color:#fff;font:700 13px system-ui;' +
            'padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);';
          document.addEventListener('DOMContentLoaded', () => document.body.appendChild(t));
          setTimeout(() => {
            try {
              t.remove();
            } catch {}
          }, 2800);
          try {
            localStorage.removeItem(toastKey);
          } catch {}
        }

        // --- bouton “Reprendre la chasse” si un contrôle existe déjà
        function findBackBtn() {
          const selectors = [
            '#back-to-game',
            '#back-to-map',
            '.leaflet-control a',
            `a[href="${withBase('index-legacy.html')}"]`,
            'a[href="index-legacy.html"]',
            'a[href="./"]',
            'a[href="#"]',
            'button.back-to-game',
          ];
          return document.querySelector(selectors.join(', '));
        }

        function setupBackBtn(btn) {
          if (!btn) return;
          btn.style.pointerEvents = 'auto';
          btn.style.cursor = 'pointer';

          const href = nextLevelHref();
          const label = href.includes('level=3')
            ? '↩︎ Reprendre la chasse (niv. 3)'
            : href.includes('level=2')
            ? '↩︎ Reprendre la chasse (niv. 2)'
            : '↩︎ Reprendre le jeu';

          if (btn.tagName === 'A') btn.setAttribute('href', href);
          btn.textContent = label;

          const go = (e) => {
            try {
              e && e.preventDefault();
            } catch {}
            try {
              document.body.style.transition = 'opacity 220ms ease';
              document.body.style.opacity = '0';
            } catch {}
            window.location.assign(href);
          };
          btn.addEventListener('click', go, { once: true });
          btn.addEventListener('touchend', go, { passive: false, once: true });
        }

        let btn = findBackBtn();
        if (btn) {
          setupBackBtn(btn);
        } else {
          const mo = new MutationObserver(() => {
            const b = findBackBtn();
            if (b) {
              mo.disconnect();
              setupBackBtn(b);
            }
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });

          // CTA de secours si aucun bouton n'existe
          setTimeout(() => {
            if (findBackBtn()) return;
            if (document.getElementById('__cta_resume__')) return;
            const href = nextLevelHref();
            const cta = document.createElement('a');
            cta.id = '__cta_resume__';
            cta.textContent = href.includes('level=3')
              ? '↩︎ Reprendre la chasse (niv. 3)'
              : href.includes('level=2')
              ? '↩︎ Reprendre la chasse (niv. 2)'
              : '↩︎ Reprendre le jeu';
            cta.href = href;
            cta.style.cssText =
              'position:fixed;left:12px;bottom:12px;z-index:10010;' +
              'background:#10223c;color:#fff;font:700 14px system-ui;' +
              'padding:10px 14px;border-radius:12px;text-decoration:none;' +
              'box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;';
            cta.addEventListener('click', (e) => {
              e.preventDefault();
              window.location.assign(href);
            });
            document.body.appendChild(cta);
          }, 900);
        }
      })();
    </script>

    <script type="module">
      (async () => {
        const isProd = !!(import.meta && import.meta.env && import.meta.env.PROD);
        if ('serviceWorker' in navigator) {
          if (isProd) {
            try {
              const base = import.meta?.env?.BASE_URL ?? new URL('.', document.baseURI).pathname;
              const swUrl = `${base.replace(/\/?$/, '/')}sw.js`;
              await navigator.serviceWorker.register(swUrl);
            } catch {}
          } else {
            // DEV: désactive tout SW + vide les caches
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              for (const r of regs) await r.unregister();
              if (window.caches) {
                const keys = await caches.keys();
                for (const k of keys) await caches.delete(k);
              }
              console.log('[DEV] SW désactivé, caches vidés');
            } catch {}
          }
        }
      })();
    </script>
  </body>
</html>
