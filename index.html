<!DOCTYPE html>
<html lang="fr">
  <head>
    <script>
  (function () {
    var base = "/Hirundu1.1-/";
    var p = location.pathname;
    // 1) Si quelqu’un arrive sur .../index.html → redirige vers .../
    if (p.endsWith("/index.html") || p === "/index.html") {
      location.replace(base + (location.hash || ""));
      return;
    }
    // 2) Si on est sur le dépôt mais sans le slash final, normalise
    if (p === "/Hirundu1.1-" ) {
      location.replace(base + (location.hash || ""));
    }
  })();
</script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>HIRUNDU – Le Vol d’Aracne</title>

    <meta name="theme-color" content="#a9d6f5" />

    <!-- Chemins RELATIFS pour GitHub Pages -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le Vol d’Aracne" />

    <!-- Apple Touch Icons (relatifs) -->
    <link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />

    <!-- Favicons (relatifs) -->
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Entrée Vite (Vite réécrit ce chemin au build) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Désactiver/Nettoyer d’anciens Service Workers -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
        if (window.caches && caches.keys) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k))).catch(() => {});
        }
        try { localStorage.setItem("sw_disabled", "true"); } catch {}
      }
    </script>

    <!-- Bouton d’installation Android (PWA) -->
    <script>
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.createElement("button");
        btn.textContent = "📲 Installer l’app";
        btn.style.cssText =
          "position:fixed;right:12px;bottom:72px;z-index:10000;padding:10px 14px;border-radius:12px;border:0;background:#ffd166;font:700 14px system-ui;box-shadow:0 4px 10px rgba(0,0,0,.25);";
        document.body.appendChild(btn);
        btn.addEventListener("click", async () => {
          btn.remove();
          deferredPrompt.prompt();
          try { await deferredPrompt.userChoice; } catch {}
          deferredPrompt = null;
        });
      });
    </script>

    <!-- Astuce iOS : Ajouter à l’écran d’accueil -->
    <script>
      (function () {
        const ua = navigator.userAgent || "";
        const isIOS = /iphone|ipad|ipod/i.test(ua);
        const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
        const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
        if (isIOS && isSafari && !isStandalone) {
          const tip = document.createElement("div");
          tip.innerHTML = "Sur iPhone : <b>Partager</b> → <b>Ajouter à l’écran d’accueil</b>";
          tip.style.cssText =
            "position:fixed;left:8px;right:8px;bottom:8px;z-index:10000;background:#fff;border:1px solid #ccc;border-radius:12px;padding:10px 12px;font:600 13px system-ui;box-shadow:0 6px 16px rgba(0,0,0,.2);";
          document.body.appendChild(tip);
          setTimeout(() => tip.remove(), 8000);
        }
      })();
    </script>

    <!-- Debug erreurs JS (moins intrusif) -->
    <script>
      const __DEV__ = location.hostname.includes("localhost") || location.hostname.endsWith(".app.github.dev");
      window.addEventListener("error", (e) => {
        console.error("JS Error:", e.message, e.error);
        if (__DEV__) {
          const msg = "Erreur JS: " + e.message;
          if (!window.__errShown) { window.__errShown = true; alert(msg); setTimeout(()=>{ window.__errShown=false;}, 3000); }
        }
      });
      window.addEventListener("unhandledrejection", (e) => {
        console.error("Unhandled promise:", e.reason);
        if (__DEV__) {
          const msg = "Erreur async: " + (e.reason?.message || e.reason);
          if (!window.__rejShown) { window.__rejShown = true; alert(msg); setTimeout(()=>{ window.__rejShown=false;}, 3000); }
        }
      });
    </script>


  </body>
</html>
