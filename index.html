<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>HIRUNDU – Le Vol d’Aracne</title>

    <meta name="theme-color" content="#a9d6f5" />

    <!-- Chemins RELATIFS pour GitHub Pages -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le Vol d’Aracne" />

    <!-- Apple Touch Icons (relatifs) -->
    <link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />

    <!-- Favicons (relatifs) -->
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48x48.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Entrée Vite (Vite réécrit ce chemin au build) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Désactiver/Nettoyer d’anciens Service Workers -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {});
        if (window.caches && caches.keys) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
        }
        try {
          localStorage.setItem("sw_disabled", "true");
        } catch {}
      }
    </script>

    <!-- Bouton d’installation Android (PWA) -->
    <script>
      let deferredPrompt;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const btn = document.createElement("button");
        btn.textContent = "📲 Installer l’app";
        btn.style.cssText =
          "position:fixed;right:12px;bottom:72px;z-index:10000;padding:10px 14px;border-radius:12px;border:0;background:#ffd166;font:700 14px system-ui;box-shadow:0 4px 10px rgba(0,0,0,.25);";
        document.body.appendChild(btn);
        btn.addEventListener("click", async () => {
          btn.remove();
          deferredPrompt.prompt();
          try {
            await deferredPrompt.userChoice;
          } catch {}
          deferredPrompt = null;
        });
      });
    </script>

    <!-- Astuce iOS : Ajouter à l’écran d’accueil -->
    <script>
      (function () {
        const ua = navigator.userAgent || "";
        const isIOS = /iphone|ipad|ipod/i.test(ua);
        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone;
        const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
        if (isIOS && isSafari && !isStandalone) {
          const tip = document.createElement("div");
          tip.innerHTML = "Sur iPhone : <b>Partager</b> → <b>Ajouter à l’écran d’accueil</b>";
          tip.style.cssText =
            "position:fixed;left:8px;right:8px;bottom:8px;z-index:10000;background:#fff;border:1px solid #ccc;border-radius:12px;padding:10px 12px;font:600 13px system-ui;box-shadow:0 6px 16px rgba(0,0,0,.2);";
          document.body.appendChild(tip);
          setTimeout(() => tip.remove(), 8000);
        }
      })();
    </script>

    <!-- Debug erreurs JS -->
    <script>
      window.addEventListener("error", (e) => {
        console.error("JS Error:", e.message, e.error);
        const msg = "Erreur JS: " + e.message;
        if (!window.__errShown) {
          window.__errShown = true;
          alert(msg);
          setTimeout(() => {
            window.__errShown = false;
          }, 3000);
        }
      });
      window.addEventListener("unhandledrejection", (e) => {
        console.error("Unhandled promise:", e.reason);
        const msg = "Erreur async: " + (e.reason?.message || e.reason);
        if (!window.__rejShown) {
          window.__rejShown = true;
          alert(msg);
          setTimeout(() => {
            window.__rejShown = false;
          }, 3000);
        }
      });
    </script>

    <!-- Boot multi-niveaux SANS top-level await -->
    <script type="module">
      (async () => {
        const url = new URL(location.href);
        const hashLevel = location.hash === "#l2" ? "2" : null;
        const paramLevel = url.searchParams.get("level");
        const level = paramLevel || hashLevel || "1";

        /* === PATCH Codex : ignorer le boot en mode embed ou routes SPA === */
        const isEmbed = url.searchParams.get("embed") === "1";
        const isSpaRoute =
          !location.hash.startsWith("#/level/") &&
          (location.hash.startsWith("#/bonus") ||
            location.hash.startsWith("#/qr") ||
            location.hash.startsWith("#/market") ||
            location.hash.startsWith("#/realmap"));
        if (isEmbed || isSpaRoute) {
          console.info("Mode SPA ou embed détecté — boot du jeu ignoré.");
          return;
        }
        /* ================================================================ */

        // Déclarer explicitement les modules pour Vite (analyse statique)
        const boots = import.meta.glob([
          "./src/game.js",
          "./src/levels/level2/level2_game.js",
          "./src/levels/level3/level3_game.js"
        ]);

        const BOOTS = {
          "1": boots["./src/game.js"],
          "2": boots["./src/levels/level2/level2_game.js"],
          "3": boots["./src/levels/level3/level3_game.js"]
        };

        const START = {
          "1": (m) => m?.boot?.() || m?.startLevel1?.() || m?.start?.(),
          "2": (m) => m?.startLevel2?.() || m?.boot?.() || m?.start?.(),
          "3": (m) => m?.startLevel3?.() || m?.boot?.() || m?.start?.()
        };

        const fallbackLoader = boots["./src/game.js"];

        try {
          localStorage.setItem("otranto_bonus_unlocked", "true");
        } catch {}

        try {
          const loader = BOOTS[level] || fallbackLoader;
          const mod = await loader?.();
          const start = START[level] || START["1"];
          start?.(mod);
        } catch (e) {
          console.error("Level boot error:", e);
          try {
            const mod = await fallbackLoader?.();
            START["1"]?.(mod);
          } catch (e2) {
            console.error("Fallback L1 failed:", e2);
            alert("Erreur de chargement du niveau");
          }
        }

        // Mini splash L2 (debug court)
        if (level === "2") {
          const splash = document.createElement("div");
          splash.style.cssText = `
            position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
            background:radial-gradient(ellipse at center, rgba(255,233,150,.85), rgba(255,200,80,.65));
            font:900 28px/1.1 system-ui;color:#5b3700;text-align:center`;
          splash.textContent = "✨ Transition — Niveau 2";
          document.body.appendChild(splash);
          setTimeout(() => splash.remove(), 900);
        }
      })();
    </script>
  </body>
</html>
