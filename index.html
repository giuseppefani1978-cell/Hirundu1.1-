<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>HIRUNDU – Le Vol d’Aracne</title>

    <!-- Couleurs & PWA -->
    <meta name="theme-color" content="#a9d6f5" />
    <link rel="manifest" href="/Hirundu1.1-/manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Le Vol d’Aracne" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script type="module">
      (async () => {
        const isProd = !!(import.meta && import.meta.env && import.meta.env.PROD);
        if ('serviceWorker' in navigator) {
          if (isProd) {
            try {
              const base = import.meta?.env?.BASE_URL ?? new URL('.', document.baseURI).pathname;
              const swUrl = `${base.replace(/\/?$/, '/')}sw.js`;
              await navigator.serviceWorker.register(swUrl);
            } catch {}
          } else {
            // DEV: désactive tout SW + vide les caches
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              for (const r of regs) await r.unregister();
              if (window.caches) {
                const keys = await caches.keys();
                for (const k of keys) await caches.delete(k);
              }
              console.log('[DEV] SW désactivé, caches vidés');
            } catch {}
          }
        }
      })();
    </script>
  </body>
</html>
